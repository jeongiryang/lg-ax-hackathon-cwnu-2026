name: Android prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and check
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Save debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-mood-radio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
